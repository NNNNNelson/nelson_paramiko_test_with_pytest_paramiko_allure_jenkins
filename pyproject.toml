[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nelson-paramiko-tests"
version = "0.1.0"
description = "Paramiko SSH/SFTP 集成测试 demo"
requires-python = ">=3.10"
dependencies = ["paramiko>=5.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-html>=4.0",
    "allure-pytest>=2.13",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
log_level = "INFO"
log_cli = true
log_cli_format = "%(asctime)s - [%(levelname)s] - %(name)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --html=reports/report.html --self-contained-html --alluredir=allure-results --reruns 2 --reruns-delay 1"
markers = ["smoke: 冒烟测试-只测试远程命令", "integration: 集成测试-测试远程命令和远程文件传输"]
log_file = "reports/test_run.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s - [%(levelname)s] - %(name)s - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["constants", "conftest"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "deprecated_tests/*",
    "temp_tests/*",
    ".venv/*",
    "__pycache__/*",
    ".env*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[dependency-groups]
dev = ["allure-pytest>=2.16.2", "pytest-html>=4.2.0"]
